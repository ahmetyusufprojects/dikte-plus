[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dikte-plus"
version = "0.3.0"
description = "Groq Whisper tabanlı, görsel arayüzlü Türkçe sesli dikte uygulaması (TypeLess'ten ilhamla, sıfırdan yazıldı)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["dictation", "speech-to-text", "whisper", "groq", "turkce", "dikte", "voice-typing"]
dependencies = [
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
dikte = "dikte_plus.cli:main"

[project.gui-scripts]
dikte-gui = "dikte_plus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dikte_plus"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
